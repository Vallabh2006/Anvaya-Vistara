{% extends "base.html" %}
{% block title %}404 - Page Not Found{% endblock %}
{% block body %}
<div style="display:flex; align-items:center; justify-content:center; min-height:100vh; flex-direction:column; text-align:center; padding: var(--sp-8);">
    <h1 style="font-size: 4rem; color: var(--muted); margin-bottom: var(--sp-4);">404</h1>
    <h2 style="margin-bottom: var(--sp-4);">Page Not Found</h2>
    <p style="color: var(--muted); margin-bottom: var(--sp-6);">The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="btn">Go Home</a>
</div>
{% endblock %}
